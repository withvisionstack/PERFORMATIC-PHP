name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: performatic-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: performatic-linux-arm64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: performatic-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # LINUX: compila PHP 8.5 embed do source
      # ─────────────────────────────────────────────
      - name: Install PHP (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libclang-dev autoconf bison re2c \
            libxml2-dev libsqlite3-dev libssl-dev libcurl4-openssl-dev libonig-dev \
            wget curl ca-certificates
          wget -q https://www.php.net/distributions/php-8.5.12.tar.gz
          tar -xzf php-8.5.12.tar.gz
          cd php-8.5.12
          ./configure --prefix=/usr/local/php-embed \
            --enable-embed --enable-zts --disable-cgi --disable-cli
          make -j$(nproc)
          sudo make install
          cd ..
          echo "/usr/local/php-embed/bin" >> $GITHUB_PATH

      # ─────────────────────────────────────────────
      # MACOS: brew php@8.5 com --with-embed
      # ─────────────────────────────────────────────
      - name: Install PHP (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install php@8.5
          brew reinstall php@8.5 --with-embed
          echo "/opt/homebrew/opt/php@8.5/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/php@8.5/sbin" >> $GITHUB_PATH

      # ─────────────────────────────────────────────
      # RUST
      # ─────────────────────────────────────────────
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # ─────────────────────────────────────────────
      # EMPACOTAR (binário + README de instalação)
      # ─────────────────────────────────────────────
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/php-server dist/performatic
          chmod +x dist/performatic

          cat > dist/INSTALL.txt << 'EOF'
          ⚠️  Performatic PHP requer a biblioteca PHP embed:

          Ubuntu/Debian:
            sudo apt install libphp8.5-embed

          macOS:
            brew install php@8.5

          Depois:
            chmod +x performatic
            ./performatic serve
          EOF

          cd dist
          tar -czf ../${{ matrix.artifact }}.tar.gz performatic INSTALL.txt
          cd ..
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}