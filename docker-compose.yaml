services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: performatic
      POSTGRES_PASSWORD: performatic_logic
      POSTGRES_DB: performatic
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U performatic"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 7600
      DB_DSN: "pgsql:host=postgres;port=5432;dbname=performatic"
      DB_USER: performatic
      DB_PASS: performatic_logic
      JWT_SECRET: "troque-por-64-hex-chars-aleatorios-antes-de-producao"
    expose:
      - "7600"
    # Sem ports: — quem expõe é o Nginx

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pg_data: