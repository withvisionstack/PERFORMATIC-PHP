[package]
name = "php-server"
version = "1.2.7"
edition = "2021"
repository = "https://github.com/withvisionstack/PERFORMATIC-PHP"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
ext-php-rs = { version = "0.15.2", features = ["embed"] }
base64 = "0.23.1"
tower-http = { version = "0.5", features = ["fs"] }
notify = "6"


[toolchain]
channel = "1.99"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

