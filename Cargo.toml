[package]
name = "php-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
ext-php-rs = { version = "0.15", features = ["embed"] }
base64 = "0.23.1"
tower-http = { version = "0.6", features = ["fs"] }
